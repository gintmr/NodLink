# 公开体验版：每次推到 main，就用同一份 web/public 重新构建并发布到 GitHub Pages。
# 第一次用前，在仓库 Settings → Pages → Build and deployment 里把 Source 选成 “GitHub Actions”。
name: 发布公开体验版

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: 安装依赖
        working-directory: web
        run: npm ci
      - name: 测试核心算法
        working-directory: web
        run: npm test
      - name: 构建公开体验版
        working-directory: web
        run: npm run build:public
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
